<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Maintenance Issue</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero small">
  <div>
    <a href="/"><img src="logo.png" class="logo"></a>
    <h1>Report a Maintenance Issue</h1>
  </div>
</header>

<section class="section">
  <form action="https://api.web3forms.com/submit" method="POST" enctype="multipart/form-data">

    <input type="hidden" name="access_key" value="91fdb16f-fb5c-4f85-9fbd-576811b31599">
    <input type="hidden" name="redirect" value="https://www.rhinopropertysolutions.co.uk/maintenance-thank-you.html">
    <input type="hidden" name="subject" value="New Maintenance Issue">

    <input type="text" name="name" placeholder="Full Name" required>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="tel" name="phone" placeholder="Phone Number" required>

    <textarea name="message" placeholder="Describe the issue..." required></textarea>

<label style="display:block; margin-top:15px;">
  <input type="checkbox" name="has_media" value="Yes">
  I have photos or videos of this issue
</label>

    <label>Upload Media</label>
    <input type="file" name="attachments" multiple accept="image/*,video/*">

    <p style="font-size:12px; color:#777;">
      Max file size: 10MB per file
    </p>

    <button type="submit">Submit Report</button>
  </form>
</section>

</body>
</html>
