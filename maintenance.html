<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Maintenance Issue | Rhino Property Solutions</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero small">
  <div>
    <a href="/"><img src="logo.png" alt="Rhino Property Solutions" class="logo"></a>
    <h1>Report a Maintenance Issue</h1>
    <p>Please complete the form below. Urgent issues should also be reported via phone.</p>
  </div>
</header>

<section class="section grey">
  <p class="intro">
    Use this form to report a specific issue in your property.
    Please submit <strong>one issue per form</strong> to help us respond efficiently.
  </p>
</section>

<section class="section">

  <form action="https://api.web3forms.com/submit" method="POST">

    <!-- Web3Forms Config -->
    <input type="hidden" name="access_key" value="91fdb16f-fb5c-4f85-9fbd-576811b31599">
    <input type="hidden" name="redirect" value="https://www.rhinopropertysolutions.co.uk/maintenance-thank-you.html">
    <input type="hidden" name="subject" value="New Maintenance Issue">

    <!-- Name -->
    <input type="text" name="name" placeholder="Full Name" required>

    <!-- Email -->
    <input type="email" name="email" placeholder="Email Address" required>

    <!-- Phone -->
    <input type="tel" name="phone" placeholder="Phone Number" required>

    <!-- Property -->
    <select name="property" required>
      <option value="">Select Property</option>
      <option value="80 Dewsbury Road, L4 2XE">80 Dewsbury Road, L4 2XE</option>
      <option value="23 Helena Street, L9 1BH">23 Helena Street, L9 1BH</option>
      <option value="36 Kipling Street, L20 4QE">36 Kipling Street, L20 4QE</option>
      <option value="9 Scorton Street, L6 4AS">9 Scorton Street, L6 4AS</option>
    </select>

    <!-- Issue Type -->
    <select name="issue_type" required>
      <option value="">Select Issue Type</option>
      <option>Plumbing</option>
      <option>Electrical</option>
      <option>Heating</option>
      <option>Structural</option>
      <option>Cleaning</option>
      <option>Other</option>
    </select>

    <!-- Priority -->
    <select name="priority" required>
      <option value="">Priority Level</option>
      <option>Low</option>
      <option>Medium</option>
      <option>Urgent</option>
    </select>

    <!-- Description -->
    <textarea name="message" placeholder="Describe the issue in detail..." required></textarea>

    <!-- Checkbox -->
    <label style="display:block; margin-top:15px;">
      <input type="checkbox" name="has_media" value="Yes">
      I have photos or videos of this issue
    </label>

    <!-- Hidden field for redirect -->
    <input type="hidden" name="has_media_value" value="No">

    <div style="display:flex; gap:10px; margin-top:15px;">
      <button type="submit">Submit Report</button>
      <button type="reset" style="background:#999;">Clear Form</button>
    </div>
  </form>
</section>

<script>
  const checkbox = document.querySelector('input[name="has_media"]');
  const hiddenField = document.querySelector('input[name="has_media_value"]');

  checkbox.addEventListener('change', () => {
    hiddenField.value = checkbox.checked ? "Yes" : "No";
  });
</script>

</body>
</html>
